<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#09090b">
<title>TENX AI</title>
<style>
:root{color-scheme:dark;--bg:#09090b;--panel:#111114;--line:#27272d;--muted:#a1a1aa;--text:#f4f4f5;--accent:#a3e635}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at top,#18181b 0%,#09090b 55%);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100dvh}
.shell{max-width:920px;margin:auto;min-height:100dvh;display:flex;flex-direction:column;padding:18px 16px}
header{display:flex;align-items:center;gap:12px;padding:7px 2px 18px;border-bottom:1px solid #242428}
.logo{width:44px;height:44px;border-radius:15px;background:linear-gradient(145deg,#24242a,#101014);border:1px solid #3a3a42;display:grid;place-items:center;box-shadow:0 0 24px #a3e63510}
.robot{width:25px;height:21px;border:2px solid #d4fca2;border-radius:8px;position:relative}
.robot:before{content:"";position:absolute;top:6px;left:5px;width:4px;height:4px;background:var(--accent);border-radius:50%;box-shadow:9px 0 var(--accent)}
.robot:after{content:"";position:absolute;bottom:-6px;left:9px;width:4px;height:4px;border-radius:50%;background:var(--accent)}
.brand{font-size:18px;font-weight:800;letter-spacing:2px}.brand span{color:var(--accent)}.sub{font-size:12px;color:var(--muted);margin-top:4px}
.status{margin-left:auto;display:flex;align-items:center;gap:7px;font-size:11px;color:#b4b4bc;border:1px solid var(--line);padding:7px 10px;border-radius:999px}.dot{width:6px;height:6px;background:var(--accent);border-radius:50%;box-shadow:0 0 10px #a3e63588}
main{flex:1;display:flex;flex-direction:column;min-height:0}
.welcome{text-align:center;margin:auto 0;padding:45px 0 25px}
.biglogo{width:72px;height:72px;border:1px solid #34343a;border-radius:24px;background:#151518;margin:0 auto 22px;display:grid;place-items:center;box-shadow:0 0 70px #a3e6350b}
.biglogo .robot{transform:scale(1.45)}
h1{font-size:clamp(30px,6vw,48px);letter-spacing:-1.6px;margin:0 0 12px}.glow{color:var(--accent)}.intro{color:var(--muted);font-size:15px;line-height:1.7;max-width:510px;margin:0 auto}
.chips{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;max-width:590px;margin:28px auto 0}
.chip{background:#111114;border:1px solid #29292f;color:#e4e4e7;text-align:left;padding:14px;border-radius:14px;font-size:13px;line-height:1.5;cursor:pointer;transition:.2s}
.chip:hover{border-color:#84a94b;background:#17191a}.chip b{display:block;font-size:13px;margin-bottom:4px}.chip span{color:var(--muted);font-size:12px}
#messages{display:flex;flex-direction:column;gap:18px;padding:24px 0;flex:1}
.msg{display:flex;gap:11px;align-items:flex-start;max-width:100%}.avatar{width:31px;height:31px;flex:0 0 31px;border-radius:11px;background:#19191e;border:1px solid #303038;display:grid;place-items:center;font-size:12px;color:var(--accent);font-weight:800}
.bubble{
  padding:12px 15px;
  border:1px solid #29292f;
  background:#111114;
  border-radius:4px 15px 15px 15px;
  line-height:1.8;
  font-size:14px;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  max-width:calc(100% - 42px);
  unicode-bidi:plaintext;
  text-align:start;
}
.bubble pre{
  direction:ltr;
  text-align:left;
  white-space:pre;
  overflow-x:auto;
  background:#09090b;
  border:1px solid #303038;
  border-radius:10px;
  padding:12px;
  margin:12px 0;
  max-width:100%;
  -webkit-overflow-scrolling:touch;
}

.bubble pre code{
  display:block;
  white-space:pre;
  overflow-wrap:normal;
  word-break:normal;
  font-size:13px;
  line-height:1.7;
}
.bubble code{
  direction:ltr;
  unicode-bidi:isolate;
  text-align:left;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
}
.msg.user{flex-direction:row-reverse}.msg.user .avatar{color:#111;background:var(--accent);border-color:var(--accent)}.msg.user .bubble{background:#20231c;border-color:#3d482d;border-radius:15px 4px 15px 15px}
.error{color:#fecaca;border-color:#7f1d1d;background:#251113}
.composer-wrap{position:sticky;bottom:0;padding:12px 0 5px;background:linear-gradient(transparent,#09090b 20%)}
.composer{display:flex;align-items:flex-end;gap:9px;border:1px solid #38383f;background:#111114;border-radius:19px;padding:9px;box-shadow:0 10px 40px #0006}
textarea{flex:1;resize:none;max-height:160px;min-height:42px;background:transparent;border:0;outline:0;color:var(--text);font:inherit;font-size:14px;line-height:1.5;padding:10px 8px}
textarea::placeholder{color:#777780}.send{width:42px;height:42px;border:0;border-radius:13px;background:var(--accent);color:#111;font-size:19px;font-weight:800;cursor:pointer}.send:disabled{opacity:.4;cursor:wait}
.hint{text-align:center;font-size:11px;color:#71717a;margin:10px 0 0}.typing{color:var(--muted);font-size:13px}
@media(max-width:520px){.shell{padding:12px}.status{font-size:0;padding:9px}.status .dot{width:7px;height:7px}.chips{gap:8px}.chip{padding:12px}.welcome{padding:34px 0 20px}.intro{font-size:14px}}
  .bubble p {
  margin: 0 0 10px;
  font-size: 14px;
}

.bubble h1,
.bubble h2,
.bubble h3 {
  font-size: 16px;
  margin: 10px 0 6px;
}

.bubble ul,
.bubble ol {
  padding-left: 22px;
  margin: 6px 0 10px;
}

.bubble li {
  font-size: 14px;
}
</style>
</head>
<body>
<div class="shell">
<header>
  <div class="logo"><div class="robot"></div></div>
  <div><div class="brand">TENX <span>AI</span></div><div class="sub">Your learning companion</div></div>
  <div class="status"><span class="dot"></span> AI ASSISTANT</div>
</header>
<main>
  <section class="welcome" id="welcome">
    <div class="biglogo"><div class="robot"></div></div>
    <h1>Think bigger with <span class="glow">TENX.</span></h1>
    <p class="intro">Your AI-powered study companion. Ask questions, explore ideas, and learn something new — one conversation at a time.</p>
    <div class="chips">
      <button class="chip" data-prompt="Explain artificial intelligence in simple words."><b>✦ Explore AI</b><span>Understand artificial intelligence</span></button>
      <button class="chip" data-prompt="Help me learn Python from the beginning with a simple example."><b>⌘ Learn coding</b><span>Start with Python basics</span></button>
      <button class="chip" data-prompt="Give me a clear step-by-step explanation of photosynthesis."><b>◈ Study smarter</b><span>Break down a school topic</span></button>
      <button class="chip" data-prompt="Give me 5 creative project ideas for a student interested in technology."><b>↗ Get inspired</b><span>Discover a new project idea</span></button>
    </div>
  </section>
  <section id="messages" aria-live="polite"></section>
</main>
<div class="composer-wrap">
 <form class="composer" id="chatForm">
  
<input id="imageInput" type="file" accept="image/*" hidden>
<button type="button" id="imageButton" aria-label="Add image"
style="width:42px;height:42px;border:1px solid #38383f;border-radius:13px;background:#202024;color:#a3e635;font-size:24px;cursor:pointer;flex-shrink:0">+</button>
 
    <textarea id="prompt" rows="1" placeholder="Message TENX AI..." aria-label="Message TENX AI"></textarea>
    <button class="send" id="send" aria-label="Send message" type="submit">↑</button>
  </form>
  <p class="hint">TENX AI can make mistakes. Check important information.</p>
</div>
</div>
<script>
const form=document.getElementById('chatForm'), input=document.getElementById('prompt'), send=document.getElementById('send'), messagesEl=document.getElementById('messages'), welcome=document.getElementById('welcome');
let history = [];

const imageInput = document.getElementById('imageInput');
const imageButton = document.getElementById('imageButton');

let selectedImage = null;

imageButton.addEventListener('click', () => {
  imageInput.click();
});

imageInput.addEventListener('change', () => {
  const file = imageInput.files[0];
  if (!file) return;

  if (!file.type.startsWith('image/')) {
    alert('Please choose an image.');
    imageInput.value = '';
    return;
  }

  if (file.size > 5 * 1024 * 1024) {
    alert('Please choose an image smaller than 5 MB.');
    imageInput.value = '';
    return;
  }

  selectedImage = file;
  imageButton.textContent = '✓';
  imageButton.style.background = '#29351d';
});


function renderMessage(element, text) {
  element.replaceChildren();

  const lines = String(text).replace(/\r\n?/g, "\n").split("\n");
  let paragraphLines = [];
  let list = null;
  let codeLines = [];
  let inCode = false;

  function inline(parent, value) {
    const pattern = /(\*\*.+?\*\*|__.+?__|`[^`\n]+`|\*[^*\n]+\*)/g;
    let last = 0;
    let match;

    while ((match = pattern.exec(value)) !== null) {
      if (match.index > last) {
        parent.appendChild(
          document.createTextNode(value.slice(last, match.index))
        );
      }

      const token = match[0];
      let node;

      if (token.startsWith("**") || token.startsWith("__")) {
        node = document.createElement("strong");
        node.textContent = token.slice(2, -2);
      } else if (token.startsWith("`")) {
        node = document.createElement("code");
        node.textContent = token.slice(1, -1);
      } else {
        node = document.createElement("em");
        node.textContent = token.slice(1, -1);
      }

      parent.appendChild(node);
      last = pattern.lastIndex;
    }

    if (last < value.length) {
      parent.appendChild(
        document.createTextNode(value.slice(last))
      );
    }
  }

  function flushParagraph() {
    if (!paragraphLines.length) return;

    const p = document.createElement("p");

    paragraphLines.forEach((line, i) => {
      if (i > 0) p.appendChild(document.createElement("br"));
      inline(p, line);
    });

    element.appendChild(p);
    paragraphLines = [];
  }

  function closeList() {
    if (list) {
      element.appendChild(list);
      list = null;
    }
  }

  function flushCode() {
    const pre = document.createElement("pre");
    const code = document.createElement("code");

    code.textContent = codeLines.join("\n");
    pre.appendChild(code);
    element.appendChild(pre);
    codeLines = [];
  }

  for (const line of lines) {
    if (/^\s*```/.test(line)) {
      flushParagraph();
      closeList();

      if (inCode) {
        flushCode();
        inCode = false;
      } else {
        inCode = true;
      }
      continue;
    }

    if (inCode) {
      codeLines.push(line);
      continue;
    }

    if (!line.trim()) {
      flushParagraph();
      closeList();
      continue;
    }

    const heading = line.match(/^\s{0,3}(#{1,3})\s+(.+)$/);

    if (heading) {
      flushParagraph();
      closeList();

      const h = document.createElement("h" + heading[1].length);
      inline(h, heading[2]);
      element.appendChild(h);
      continue;
    }

    const bullet = line.match(/^\s*[-*+]\s+(.+)$/);
    const numbered = line.match(/^\s*\d+[.)]\s+(.+)$/);

    if (bullet || numbered) {
      flushParagraph();

      const type = bullet ? "ul" : "ol";

      if (!list || list.tagName.toLowerCase() !== type) {
        closeList();
        list = document.createElement(type);
      }

      const li = document.createElement("li");
      inline(li, (bullet || numbered)[1]);
      list.appendChild(li);
      continue;
    }

    closeList();
    paragraphLines.push(line);
  }

  flushParagraph();
  closeList();

  if (inCode) flushCode();
}


function addMessage(role, text, isError = false) {
  const row = document.createElement("div");
  row.className = "msg " + (role === "user" ? "user" : "assistant");

  const avatar = document.createElement("div");
  avatar.className = "avatar";
  avatar.textContent = role === "user" ? "YOU" : "TX";

  const bubble = document.createElement("div");
  bubble.className = "bubble" + (isError ? " error" : "");
  bubble.dir = "auto";
  renderMessage(bubble, text);

  row.append(avatar, bubble);
  messagesEl.appendChild(row);
  row.scrollIntoView({ behavior: "smooth", block: "end" });
  return bubble;
}
 
function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const result = String(reader.result);
      resolve(result.split(',')[1]);
    };
    reader.onerror = () => reject(new Error('Could not read the image.'));
    reader.readAsDataURL(file);
  });
}

async function sendMessage(text) {
  text = text.trim();
  if ((!text && !selectedImage) || send.disabled) return;

  if (!text && selectedImage) {
    text = 'Please analyze this image and explain what you see.';
  }

  welcome.style.display = 'none';

  addMessage(
    'user',
    selectedImage ? '📷 Image attached\n' + text : text
  );

  history.push({ role: 'user', content: text });

  input.value = '';
  input.style.height = 'auto';
  send.disabled = true;
  send.textContent = '…';

  const waiting = addMessage('assistant', 'Thinking…');
  waiting.classList.add('typing');

  try {
    const body = { messages: history };

    if (selectedImage) {
      body.image = {
        mimeType: selectedImage.type,
        data: await fileToBase64(selectedImage)
      };
    }

    const response = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });

    const data = await response.json().catch(() => ({
      error: 'Unexpected server response.'
    }));

    if (!response.ok) {
      throw new Error(data.error || 'Request failed (' + response.status + ').');
    }

    if (typeof data.reply !== 'string' || !data.reply.trim()) {
      throw new Error('The AI returned an empty response. Try again.');
    }

    waiting.classList.remove('typing');
    renderMessage(waiting, data.reply);
    history.push({ role: 'assistant', content: data.reply });

    selectedImage = null;
    imageInput.value = '';
    imageButton.textContent = '+';
    imageButton.style.background = '#202024';

  } catch (e) {
    waiting.classList.remove('typing');
    waiting.classList.add('error');
    waiting.textContent = 'Could not get a reply: ' +
      (e.message || 'Unknown error') +
      ' You can check /api/health and your Vercel logs.';
    history.pop();

  } finally {
    send.disabled = false;
    send.textContent = '↑';
    input.focus();
  }
}

form.addEventListener('submit',e=>{e.preventDefault();sendMessage(input.value)});
input.addEventListener('input',()=>{input.style.height='auto';input.style.height=Math.min(input.scrollHeight,160)+'px'});
input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();form.requestSubmit()}});
document.querySelectorAll('[data-prompt]').forEach(b=>b.addEventListener('click',()=>sendMessage(b.dataset.prompt)));
</script>
</body>
</html>
