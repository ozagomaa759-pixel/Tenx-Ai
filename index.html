<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tenx AI</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.5;
            white-space: pre-wrap;
        }
        .user {
            align-self: flex-end;
            background-color: #007bff;
            color: #fff;
        }
        .bot {
            align-self: flex-start;
            background-color: #2a2a2a;
            color: #e0e0e0;
        }
        #input-container {
            display: flex;
            padding: 15px;
            background-color: #1e1e1e;
        }
        #user-input {
            flex: 1;
            padding: 12px;
            border: 1px solid #333;
            border-radius: 8px;
            background-color: #2a2a2a;
            color: #fff;
            outline: none;
        }
        #send-btn {
            margin-right: 10px;
            padding: 12px 20px;
            background-color: #007bff;
            border: none;
            border-radius: 8px;
            color: white;
            cursor: pointer;
        }
        #send-btn:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <div id="chat-container"></div>

    <div id="input-container">
        <input type="text" id="user-input" placeholder="اكتب رسالتك هنا..." onkeydown="if(event.key === 'Enter') sendMessage()">
        <button id="send-btn" onclick="sendMessage()">إرسال</button>
    </div>

    <script>
        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('user-input');
        let conversationHistory = [];

        function appendMessage(sender, text) {
            const msgDiv = document.createElement('div');
            msgDiv.classList.add('message', sender);
            msgDiv.textContent = text;
            chatContainer.appendChild(msgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            appendMessage('user', text);
            userInput.value = '';

            // إضافة رسالة المستخدم لـ History
            conversationHistory.push({
                role: 'user',
                parts: [{ text: text }]
            });

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: conversationHistory })
                });

                const data = await response.json();

                if (data.error) {
                    appendMessage('bot', 'خطأ: ' + data.error);
                } else if (data.candidates && data.candidates[0].content) {
                    const botReply = data.candidates[0].content.parts[0].text;
                    appendMessage('bot', botReply);
                    
                    // حفظ رد الـ AI في الـ History
                    conversationHistory.push({
                        role: 'model',
                        parts: [{ text: botReply }]
                    });
                } else {
                    appendMessage('bot', 'عذراً، لم يتم استلام رد صحيح.');
                }
            } catch (err) {
                appendMessage('bot', 'حدث خطأ أثناء الاتصال بالسيرفر.');
            }
        }
    </script>
</body>
</html>
