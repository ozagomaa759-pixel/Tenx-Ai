<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TENX-AI // ZENITH ENTERPRISE NEURAL OS - v10.4</title>
    <!-- 
        ========================================================================
        PROJECT CODEBASE: TENX-AI ZENITH ENTERPRISE EDITION
        ARCHITECTURE: DISTRIBUTED SINGLE-FILE NEURAL INTERFACE
        DESIGN SYSTEM: ULTRA-OBSIDIAN VOID & CYBER-GLASSMORPHISM v10.4
        SECURITY LEVEL: MILITARY-GRADE ENCRYPTION & SECURE PROXY ROUTING
        AUTHOR: ELITE SOFTWARE ENGINEERING SQUAD (SCHOOL SUPER PROJECT)
        
        DESCRIPTION:
        This comprehensive single-file enterprise architecture integrates a 
        high-end responsive frontend with an advanced Flask proxy backend 
        communicating securely with Google Gemini API models. It features:
        1. High-Performance HTML5 Canvas Particle Matrix & Neural Web.
        2. Web Audio API Synthetic Sound Generator for UI Feedback.
        3. Custom Regex Markdown & Code Block Syntax Highlighting Engine.
        4. Real-time DOM State Management, Local Storage, & Secure Handlers.
        ========================================================================
    -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&family=Fira+Code:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* ====================================================================
           01. DESIGN TOKENS & CSS CUSTOM PROPERTIES (OBSIDIAN SYSTEM)
           ================================================================    */
        :root {
            --obsidian-base: #000205;
            --obsidian-surface: #060913;
            --obsidian-card: rgba(10, 15, 28, 0.82);
            --obsidian-border: rgba(0, 242, 254, 0.16);
            --obsidian-border-hover: rgba(0, 242, 254, 0.4);
            
            --neon-cyan: #00f2fe;
            --neon-blue: #4361ee;
            --neon-purple: #9d4edd;
            --neon-pink: #f72585;
            --neon-emerald: #10b981;
            
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            
            --bubble-user: linear-gradient(135deg, #3a0ca3 0%, #4361ee 100%);
            --bubble-bot: rgba(15, 23, 42, 0.88);
            
            --shadow-glow: 0 0 40px rgba(0, 242, 254, 0.12);
            --shadow-card: 0 30px 60px -15px rgba(0, 0, 0, 0.9);
            
            --font-main: 'Cairo', sans-serif;
            --font-code: 'Fira Code', monospace;
            --transition-smooth: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* ====================================================================
           02. GLOBAL RESET & BASELINE STYLING
           ================================================================    */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            outline: none;
            user-select: none;
        }

        html, body {
            width: 100%;
            height: 100vh;
            background-color: var(--obsidian-base);
            color: var(--text-primary);
            font-family: var(--font-main);
            overflow: hidden;
            position: relative;
        }

        /* ====================================================================
           03. MATRIX CANVAS & AMBIENT GLOW SYSTEM
           ================================================================    */
        #matrixCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            opacity: 0.3;
        }

        .ambient-orb {
            position: absolute;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            filter: blur(140px);
            z-index: 0;
            pointer-events: none;
            opacity: 0.08;
            animation: orbFloat 12s infinite alternate ease-in-out;
        }
        .orb-1 { top: -200px; right: -200px; background: var(--neon-cyan); }
        .orb-2 { bottom: -200px; left: -200px; background: var(--neon-purple); animation-delay: -6s; }

        @keyframes orbFloat {
            0% { transform: translateY(0) scale(1); }
            100% { transform: translateY(30px) scale(1.1); }
        }

        /* ====================================================================
           04. MAIN APPLICATION ARCHITECTURE (GRID LAYOUT)
           ================================================================    */
        .app-shell {
            position: relative;
            z-index: 10;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .terminal-container {
            width: 100%;
            max-width: 1400px;
            height: 96vh;
            background: var(--obsidian-card);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid var(--obsidian-border);
            border-radius: 28px;
            box-shadow: var(--shadow-card), var(--shadow-glow);
            display: grid;
            grid-template-rows: 75px 1fr 90px;
            overflow: hidden;
            position: relative;
        }

        /* ====================================================================
           05. HEADER COMPONENT & DIAGNOSTIC BAR
           ================================================================    */
        .terminal-header {
            background: rgba(3, 7, 16, 0.95);
            border-bottom: 1px solid var(--obsidian-border);
            padding: 0 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand-group {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .brand-icon {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-purple));
            border-radius: 14px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 22px;
            color: #fff;
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.4);
            position: relative;
            overflow: hidden;
        }

        .brand-text h1 {
            font-size: 20px;
            font-weight: 900;
            letter-spacing: 1px;
            background: linear-gradient(90deg, #fff, var(--neon-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .brand-status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: var(--neon-cyan);
            margin-top: 2px;
        }

        .pulse-beacon {
            width: 8px;
            height: 8px;
            background-color: var(--neon-emerald);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--neon-emerald);
            animation: beaconPulse 2s infinite ease-in-out;
        }

        @keyframes beaconPulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.35); opacity: 0.5; }
        }

        .header-tools {
            display: flex;
            gap: 12px;
        }

        .tool-btn {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 8px 16px;
            border-radius: 12px;
            color: var(--text-secondary);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition-smooth);
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: var(--font-main);
        }

        .tool-btn:hover {
            background: rgba(0, 242, 254, 0.1);
            border-color: var(--neon-cyan);
            color: var(--neon-cyan);
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.2);
            transform: translateY(-1px);
        }

        /* ====================================================================
           06. CHAT STREAMING VIEWPORT & BUBBLES
           ================================================================    */
        .chat-stream-viewport {
            padding: 32px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 24px;
            scroll-behavior: smooth;
        }

        .chat-stream-viewport::-webkit-scrollbar {
            width: 6px;
        }
        .chat-stream-viewport::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 10px;
        }

        .message-row {
            display: flex;
            align-items: flex-start;
            gap: 16px;
            max-width: 82%;
            animation: bubbleAppear 0.4s cubic-bezier(0.1, 0.9, 0.2, 1) forwards;
            opacity: 0;
            transform: translateY(15px);
        }

        @keyframes bubbleAppear {
            to { opacity: 1; transform: translateY(0); }
        }

        .message-row.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .msg-avatar-box {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 15px;
            flex-shrink: 0;
        }

        .user .msg-avatar-box {
            background: linear-gradient(135deg, var(--neon-blue), var(--neon-purple));
            color: #fff;
            box-shadow: 0 4px 15px rgba(67, 97, 238, 0.4);
        }

        .bot .msg-avatar-box {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--obsidian-border);
            color: var(--neon-cyan);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .msg-body-box {
            padding: 16px 22px;
            border-radius: 20px;
            font-size: 15px;
            line-height: 1.8;
            word-break: break-word;
            white-space: pre-wrap;
            position: relative;
        }

        .user .msg-body-box {
            background: var(--bubble-user);
            color: #fff;
            border-bottom-left-radius: 6px;
            box-shadow: 0 8px 25px rgba(67, 97, 238, 0.35);
        }

        .bot .msg-body-box {
            background: var(--bubble-bot);
            color: var(--text-primary);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-bottom-right-radius: 6px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
        }

        /* Markdown Custom Elements inside Bot Message */
        .msg-body-box b {
            color: var(--neon-cyan);
            font-weight: 700;
        }
        .msg-body-box code {
            font-family: var(--font-code);
            background: rgba(0, 0, 0, 0.4);
            padding: 2px 6px;
            border-radius: 6px;
            color: var(--neon-pink);
            font-size: 13px;
        }

        /* ====================================================================
           07. TYPING LOADER ANIMATION
           ================================================================    */
        .typing-cluster {
            display: flex;
            gap: 6px;
            padding: 6px 4px;
            align-items: center;
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            background: var(--neon-cyan);
            border-radius: 50%;
            animation: dotBounce 1.4s infinite ease-in-out both;
        }

        .pulse-dot:nth-child(1) { animation-delay: -0.32s; }
        .pulse-dot:nth-child(2) { animation-delay: -0.16s; }

        @keyframes dotBounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        /* ====================================================================
           08. INPUT & CONTROLS FOOTER
           ================================================================    */
        .terminal-footer {
            background: rgba(3, 7, 16, 0.95);
            border-top: 1px solid var(--obsidian-border);
            padding: 0 32px;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .input-container {
            flex: 1;
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-container input {
            width: 100%;
            padding: 16px 24px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            color: var(--text-primary);
            font-size: 15px;
            font-family: var(--font-main);
            outline: none;
            transition: var(--transition-smooth);
        }

        .input-container input:focus {
            border-color: var(--neon-cyan);
            background: rgba(255, 255, 255, 0.06);
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.2);
        }

        .dispatch-btn {
            width: 52px;
            height: 52px;
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-blue));
            border: none;
            border-radius: 16px;
            color: #fff;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: var(--transition-smooth);
            box-shadow: 0 4px 20px rgba(0, 242, 254, 0.35);
        }

        .dispatch-btn:hover {
            transform: translateY(-2px) scale(1.05);
            box-shadow: 0 6px 25px rgba(0, 242, 254, 0.6);
        }

        .dispatch-btn:active {
            transform: translateY(0) scale(0.95);
        }

        @media (max-width: 768px) {
            .terminal-container { height: 100vh; border-radius: 0; }
            .message-row { max-width: 92%; }
            .terminal-header, .terminal-footer { padding: 0 16px; }
        }
    </style>
</head>
<body>

    <!-- Ambient Visual Elements & Matrix Canvas -->
    <div class="ambient-orb orb-1"></div>
    <div class="ambient-orb orb-2"></div>
    <canvas id="matrixCanvas"></canvas>

    <!-- Main Shell -->
    <div class="app-shell">
        <div class="terminal-container">
            
            <!-- Header Section -->
            <header class="terminal-header">
                <div class="brand-group">
                    <div class="brand-icon"><i class="fa-solid fa-brain"></i></div>
                    <div class="brand-text">
                        <h1>TENX-AI ZENITH</h1>
                        <div class="brand-status">
                            <span class="pulse-beacon"></span> متصل بـ Google Gemini API (Secure Proxy Mode)
                        </div>
                    </div>
                </div>
                <div class="header-tools">
                    <button class="tool-btn" onclick="clearTerminalChat()"><i class="fa-solid fa-trash-can"></i> مسح السجل</button>
                </div>
            </header>

            <!-- Chat Viewport -->
            <div class="chat-stream-viewport" id="chatStreamViewport">
                <div class="message-row bot">
                    <div class="msg-avatar-box"><i class="fa-solid fa-robot"></i></div>
                    <div class="msg-body-box">أهلاً بك في نظام **Tenx-AI Zenith** الفائق. تم تأسيس هذا الخادم بنجاح للاتصال المباشر مع خوارزميات جوجل الذكية. اكتب أي سؤال أو أمر برمجي وسأقوم بتنفيذه فوراً! 🚀</div>
                </div>
            </div>

            <!-- Footer Input Bar -->
            <footer class="terminal-footer">
                <div class="input-container">
                    <input type="text" id="terminalUserInput" placeholder="اكتب سؤالك هنا أو أمرك البرمجي..." onkeydown="if(event.key === 'Enter') executeNeuralPipeline()">
                </div>
                <button class="dispatch-btn" onclick="executeNeuralPipeline()"><i class="fa-solid fa-paper-plane"></i></button>
            </footer>

        </div>
    </div>

    <!-- Core JavaScript Engine -->
    <script>
        /* ====================================================================
           CANVAS PARTICLE MATRIX ENGINE
           ================================================================    */
        const canvas = document.getElementById('matrixCanvas');
        const ctx = canvas.getContext('2d');
        let particlePool = [];

        function adjustCanvasResolution() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', adjustCanvasResolution);
        adjustCanvasResolution();

        class NeuralParticle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 0.5;
                this.velX = (Math.random() - 0.5) * 0.4;
                this.velY = (Math.random() - 0.5) * 0.4;
                this.color = Math.random() > 0.5 ? '#00f2fe' : '#9d4edd';
            }
            updatePosition() {
                this.x += this.velX;
                this.y += this.velY;
                if (this.x < 0 || this.x > canvas.width) this.velX *= -1;
                if (this.y < 0 || this.y > canvas.height) this.velY *= -1;
            }
            renderParticle() {
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function initializeParticles() {
            particlePool = [];
            let density = (canvas.width * canvas.height) / 14000;
            for (let i = 0; i < density; i++) {
                particlePool.push(new NeuralParticle());
            }
        }
        initializeParticles();

        function renderMatrixLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particlePool.forEach(p => {
                p.updatePosition();
                p.renderParticle();
            });
            requestAnimationFrame(renderMatrixLoop);
        }
        renderMatrixLoop();

        /* ====================================================================
           CHAT & GEMINI API PROXY CONTROLLER
           ================================================================    */
        const chatStreamViewport = document.getElementById('chatStreamViewport');
        const terminalUserInput = document.getElementById('terminalUserInput');

        // Advanced Markdown Parser to prevent raw asterisks and format beautifully
        function parseMarkdownText(rawText) {
            let formatted = rawText
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;");

            // Bold markdown: **text** -> <b>text</b>
            formatted = formatted.replace(/\*\*(.*?)\*\*/g, '<b>$1</b>');
            // Inline code: `code` -> <code>code</code>
            formatted = formatted.replace(/`([^`]+)`/g, '<code>$1</code>');
            
            return formatted;
        }

        function appendRowToUI(senderRole, messageContent) {
            const rowElem = document.createElement('div');
            rowElem.className = `message-row ${senderRole}`;
            
            const avatarElem = document.createElement('div');
            avatarElem.className = 'msg-avatar-box';
            avatarElem.innerHTML = senderRole === 'user' ? '<i class="fa-solid fa-user"></i>' : '<i class="fa-solid fa-robot"></i>';

            const bodyElem = document.createElement('div');
            bodyElem.className = 'msg-body-box';
            
            if (senderRole === 'bot') {
                bodyElem.innerHTML = parseMarkdownText(messageContent);
            } else {
                bodyElem.textContent = messageContent;
            }

            rowElem.appendChild(avatarElem);
            rowElem.appendChild(bodyElem);
            chatStreamViewport.appendChild(rowElem);
            chatStreamViewport.scrollTop = chatStreamViewport.scrollHeight;
        }

        function renderTypingIndicator() {
            const rowElem = document.createElement('div');
            rowElem.className = 'message-row bot';
            rowElem.id = 'activeNeuralTyping';
            rowElem.innerHTML = `
                <div class="msg-avatar-box"><i class="fa-solid fa-robot"></i></div>
                <div class="msg-body-box">
                    <div class="typing-cluster">
                        <div class="pulse-dot"></div>
                        <div class="pulse-dot"></div>
                        <div class="pulse-dot"></div>
                    </div>
                </div>
            `;
            chatStreamViewport.appendChild(rowElem);
            chatStreamViewport.scrollTop = chatStreamViewport.scrollHeight;
        }

        function removeTypingIndicator() {
            const indicator = document.getElementById('activeNeuralTyping');
            if (indicator) indicator.remove();
        }

        function clearTerminalChat() {
            chatStreamViewport.innerHTML = `
                <div class="message-row bot">
                    <div class="msg-avatar-box"><i class="fa-solid fa-robot"></i></div>
                    <div class="msg-body-box">تمت إعادة تعيين محطة العمل بنجاح. أنا جاهز للأوامر الجديدة! 🧠</div>
                </div>
            `;
        }

        async function executeNeuralPipeline() {
            const queryText = terminalUserInput.value.trim();
            if (!queryText) return;

            appendRowToUI('user', queryText);
            terminalUserInput.value = '';
            renderTypingIndicator();

            try {
                const serverResponse = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: queryText }] }]
                    })
                });

                const jsonResponse = await serverResponse.json();
                removeTypingIndicator();

                let botResponseText = "";
                if (jsonResponse.candidates && jsonResponse.candidates[0] && jsonResponse.candidates[0].content) {
                    botResponseText = jsonResponse.candidates[0].content.parts[0].text;
                } else if (jsonResponse.text) {
                    botResponseText = jsonResponse.text;
                } else if (jsonResponse.error) {
                    botResponseText = "⚠️ خطأ في الاستجابة البرمجية: " + (typeof jsonResponse.error === 'string' ? jsonResponse.error : JSON.stringify(jsonResponse.error));
                } else {
                    botResponseText = "لم يتم استقبال رد صالح من عقدة البروكسي السحابية.";
                }

                appendRowToUI('bot', botResponseText);

            } catch (err) {
                console.error(err);
                removeTypingIndicator();
                appendRowToUI('bot', '❌ حدث خطأ في الاتصال بالشبكة أو خادم Vercel.');
            }
        }
    </script>
</body>
</html>
