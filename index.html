
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>TENX AI</title>

  <style>
    :root {
      color-scheme: dark;
      --bg: #080a0a;
      --panel: #101414;
      --panel2: #151b19;
      --green: #45f0a0;
      --text: #f0f5f2;
      --muted: #929d97;
      --border: #252e29;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        Tahoma, Arial, sans-serif;
    }

    button, textarea { font: inherit; }

    .app {
      width: 100%;
      max-width: 920px;
      min-height: 100vh;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      padding: 0 16px;
    }

    header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 18px 0;
      border-bottom: 1px solid var(--border);
    }

    .logo {
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      border-radius: 14px;
      color: var(--green);
      background: #12251b;
      border: 1px solid #24553b;
      font-size: 23px;
    }

    header h1 {
      font-size: 18px;
      margin: 0;
      letter-spacing: 1px;
    }

    header p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 12px;
    }

    .status {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 7px;
      color: var(--muted);
      font-size: 12px;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--green);
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 28px 0 16px;
    }

    .welcome {
      text-align: center;
      padding: 34px 10px 24px;
    }

    .robot {
      width: 78px;
      height: 78px;
      margin: 0 auto 18px;
      border-radius: 25px;
      display: grid;
      place-items: center;
      font-size: 38px;
      background: radial-gradient(circle at top, #203c2d, #101613);
      border: 1px solid #315b43;
      box-shadow: 0 0 35px #183d2933;
    }

    .welcome h2 {
      margin: 0;
      font-size: clamp(25px, 5vw, 36px);
    }

    .welcome h2 span { color: var(--green); }

    .welcome p {
      color: var(--muted);
      max-width: 500px;
      margin: 12px auto 0;
      line-height: 1.7;
      font-size: 14px;
    }

    .suggestions {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin: 12px 0 24px;
    }

    .suggestion {
      text-align: left;
      padding: 15px;
      color: var(--text);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      cursor: pointer;
      line-height: 1.5;
    }

    .suggestion:hover {
      border-color: #376b4c;
      background: var(--panel2);
    }

    .suggestion strong {
      display: block;
      margin-bottom: 5px;
      font-size: 14px;
    }

    .suggestion small {
      color: var(--muted);
      font-size: 12px;
    }

    #messages {
      display: flex;
      flex-direction: column;
      gap: 22px;
    }

    .message {
      width: 100%;
      display: flex;
      gap: 10px;
      align-items: flex-start;
    }

    .avatar {
      flex: 0 0 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border-radius: 11px;
      background: #14241a;
      border: 1px solid #294834;
      color: var(--green);
      font-size: 17px;
    }

    .message.user .avatar {
      background: #1c2220;
      border-color: var(--border);
      color: white;
    }

    .bubble-wrap {
      min-width: 0;
      flex: 1;
    }

    .sender {
      font-size: 12px;
      color: var(--muted);
      margin: 2px 0 8px;
    }

    .bubble {
      line-height: 1.75;
      overflow-wrap: anywhere;
      font-size: 15px;
      white-space: pre-wrap;
    }

    .message.user .bubble {
      display: inline-block;
      background: var(--panel2);
      border: 1px solid var(--border);
      padding: 10px 14px;
      border-radius: 4px 15px 15px 15px;
      max-width: 100%;
    }

    .bubble p { margin: 0 0 12px; }
    .bubble p:last-child { margin-bottom: 0; }

    .bubble pre {
      overflow-x: auto;
      padding: 14px;
      border-radius: 10px;
      background: #050707;
      border: 1px solid var(--border);
      direction: ltr;
      text-align: left;
      white-space: pre;
    }

    .bubble code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 13px;
    }

    .bubble :not(pre) > code {
      background: #202823;
      padding: 2px 5px;
      border-radius: 5px;
    }

    .bubble img {
      display: block;
      max-width: min(100%, 300px);
      max-height: 260px;
      object-fit: contain;
      border-radius: 10px;
      margin-top: 8px;
    }

    .cursor {
      display: inline-block;
      width: 7px;
      height: 16px;
      margin-left: 3px;
      vertical-align: -3px;
      background: var(--green);
      animation: blink .8s steps(2, start) infinite;
    }

    @keyframes blink { to { visibility: hidden; } }

    .composer-wrap {
      position: sticky;
      bottom: 0;
      padding: 12px 0 18px;
      background: linear-gradient(transparent, var(--bg) 20%);
    }

    .image-preview {
      display: none;
      align-items: center;
      gap: 10px;
      padding: 8px;
      margin-bottom: 8px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--panel);
    }

    .image-preview img {
      width: 46px;
      height: 46px;
      object-fit: cover;
      border-radius: 8px;
    }

    .image-preview span {
      flex: 1;
      font-size: 12px;
      color: var(--muted);
    }

    .remove-image {
      background: transparent;
      border: 0;
      color: var(--text);
      padding: 8px;
      cursor: pointer;
    }

    .composer {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      padding: 10px;
      border: 1px solid #344139;
      background: #111614;
      border-radius: 17px;
      box-shadow: 0 8px 30px #0005;
    }

    #prompt {
      flex: 1;
      min-width: 0;
      resize: none;
      border: 0;
      outline: 0;
      color: var(--text);
      background: transparent;
      padding: 10px 6px;
      line-height: 1.6;
      max-height: 160px;
      direction: auto;
    }

    #prompt::placeholder { color: #77827b; }

    .icon-btn, #send {
      flex: 0 0 auto;
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      cursor: pointer;
      border: 1px solid var(--border);
      color: var(--text);
      background: #1a211d;
    }

    #send {
      color: #04150b;
      background: var(--green);
      border-color: var(--green);
      font-weight: 800;
      font-size: 18px;
    }

    button:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    .disclaimer {
      text-align: center;
      color: #707b74;
      font-size: 11px;
      margin: 10px 0 0;
    }

    .error { color: #ff9a9a; }

    @media (max-width: 540px) {
      .app { padding: 0 12px; }
      .suggestions { grid-template-columns: 1fr; }
      .welcome { padding-top: 24px; }
      main { padding-top: 12px; }
    }
  </style>
</head>

<body>
<div class="app">
  <header>
    <div class="logo">✳</div>
    <div>
      <h1>TENX AI</h1>
      <p>Your intelligent learning assistant</p>
    </div>
    <div class="status"><span class="dot"></span> AI Assistant</div>
  </header>

  <main>
    <section class="welcome" id="welcome">
      <div class="robot">🤖</div>
      <h2>Welcome to <span>TENX AI</span></h2>
      <p>
        Ask questions, learn programming, explore science,
        or upload an image to get help with your studies.
      </p>
    </section>

    <section class="suggestions" id="suggestions">
      <button class="suggestion" data-prompt="Explain Python variables with a simple example.">
        <strong>⌨️ Learn Python</strong>
        <small>Understand programming step by step</small>
      </button>
      <button class="suggestion" data-prompt="Explain artificial intelligence in simple language.">
        <strong>🧠 Explore AI</strong>
        <small>Discover how artificial intelligence works</small>
      </button>
      <button class="suggestion" data-prompt="Help me solve a math problem step by step.">
        <strong>📐 Solve a problem</strong>
        <small>Understand the solution clearly</small>
      </button>
      <button class="suggestion" data-prompt="Give me a beginner-friendly science fact and explain it.">
        <strong>🔬 Explore science</strong>
        <small>Learn something new</small>
      </button>
    </section>

    <section id="messages" aria-live="polite"></section>
  </main>

  <div class="composer-wrap">
    <div class="image-preview" id="imagePreview">
      <img id="previewImage" alt="Selected image">
      <span id="imageName">Image selected</span>
      <button class="remove-image" id="removeImage" type="button">✕</button>
    </div>

    <form class="composer" id="chatForm">
      <input type="file" id="imageInput" accept="image/*" hidden>
      <button class="icon-btn" id="imageButton" type="button" aria-label="Upload image">＋</button>
      <textarea id="prompt" rows="1" placeholder="Message TENX AI..." aria-label="Message"></textarea>
      <button id="send" type="submit" aria-label="Send message">↑</button>
    </form>
    <p class="disclaimer">TENX AI can make mistakes. Check important information.</p>
  </div>
</div>

<script>
  const messagesEl = document.getElementById("messages");
  const welcomeEl = document.getElementById("welcome");
  const suggestionsEl = document.getElementById("suggestions");
  const form = document.getElementById("chatForm");
  const promptEl = document.getElementById("prompt");
  const sendBtn = document.getElementById("send");
  const imageBtn = document.getElementById("imageButton");
  const imageInput = document.getElementById("imageInput");
  const imagePreview = document.getElementById("imagePreview");
  const previewImage = document.getElementById("previewImage");
  const imageName = document.getElementById("imageName");
  const removeImageBtn = document.getElementById("removeImage");

  let history = [];
  let selectedImage = null;
  let sending = false;

  function escapeHTML(value) {
    return String(value).replace(/[&<>"']/g, char => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;"
    })[char]);
  }

  function renderMessage(text) {
    let html = escapeHTML(text);

    html = html.replace(/```([a-zA-Z0-9_-]*)\n?([\s\S]*?)```/g,
      (_, lang, code) => `<pre><code>${code.trim()}</code></pre>`);

    html = html.replace(/`([^`\n]+)`/g, "<code>$1</code>");
    html = html.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
    html = html.replace(/^### (.+)$/gm, "<strong>$1</strong>");
    html = html.replace(/^## (.+)$/gm, "<strong>$1</strong>");
    html = html.replace(/^\s*[-*] (.+)$/gm, "• $1");
    html = html.replace(/\n/g, "<br>");

    return html;
  }

  function createMessage(role, text, imageUrl = null) {
    const row = document.createElement("div");
    row.className = `message ${role}`;

    const avatar = document.createElement("div");
    avatar.className = "avatar";
    avatar.textContent = role === "user" ? "●" : "✳";

    const wrap = document.createElement("div");
    wrap.className = "bubble-wrap";

    const sender = document.createElement("div");
    sender.className = "sender";
    sender.textContent = role === "user" ? "You" : "TENX AI";

    const bubble = document.createElement("div");
    bubble.className = "bubble";

    if (role === "assistant") {
      bubble.innerHTML = renderMessage(text);
    } else {
      bubble.textContent = text;
    }

    if (imageUrl) {
      const img = document.createElement("img");
      img.src = imageUrl;
      img.alt = "Uploaded image";
      bubble.appendChild(img);
    }

    wrap.append(sender, bubble);
    row.append(avatar, wrap);
    messagesEl.appendChild(row);

    return { row, bubble };
  }

  function fileToBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();

      reader.onload = () => {
        const result = String(reader.result);
        resolve(result.substring(result.indexOf(",") + 1));
      };

      reader.onerror = () => reject(new Error("Could not read the selected image."));
      reader.readAsDataURL(file);
    });
  }

  function setImage(file) {
    if (!file) return;

    if (!file.type.startsWith("image/")) {
      alert("Please select an image file.");
      return;
    }

    if (file.size > 7 * 1024 * 1024) {
      alert("Please choose an image smaller than 7 MB.");
      return;
    }

    selectedImage = file;
    previewImage.src = URL.createObjectURL(file);
    imageName.textContent = file.name;
    imagePreview.style.display = "flex";
  }

  function clearImage() {
    selectedImage = null;
    imageInput.value = "";
    previewImage.removeAttribute("src");
    imagePreview.style.display = "none";
  }

  imageBtn.addEventListener("click", () => imageInput.click());
  imageInput.addEventListener("change", () => setImage(imageInput.files[0]));
  removeImageBtn.addEventListener("click", clearImage);

  document.querySelectorAll("[data-prompt]").forEach(button => {
    button.addEventListener("click", () => {
      promptEl.value = button.dataset.prompt;
      sendMessage();
    });
  });

  promptEl.addEventListener("input", () => {
    promptEl.style.height = "auto";
    promptEl.style.height = Math.min(promptEl.scrollHeight, 160) + "px";
  });

  promptEl.addEventListener("keydown", event => {
    if (event.key === "Enter" && !event.shiftKey) {
      event.preventDefault();
      sendMessage();
    }
  });

  form.addEventListener("submit", event => {
    event.preventDefault();
    sendMessage();
  });

  function showError(message) {
    const result = createMessage("assistant", "");
    result.bubble.classList.add("error");
    result.bubble.textContent = message;
    result.row.scrollIntoView({ behavior: "smooth", block: "end" });
  }

  async function sendMessage() {
    if (sending) return;

    const text = promptEl.value.trim();
    if (!text && !selectedImage) return;

    sending = true;
    sendBtn.disabled = true;
    imageBtn.disabled = true;
    welcomeEl.style.display = "none";
    suggestionsEl.style.display = "none";

    const imageFile = selectedImage;
    const imageForDisplay = imageFile ? URL.createObjectURL(imageFile) : null;
    const userText = text || "Please analyze this image.";

    createMessage("user", userText, imageForDisplay);
    history.push({ role: "user", content: userText });

    promptEl.value = "";
    promptEl.style.height = "auto";
    clearImage();

    const answerMessage = createMessage("assistant", "");
    const cursor = document.createElement("span");
    cursor.className = "cursor";
    answerMessage.bubble.appendChild(cursor);

    let answer = "";

    try {
      const body = { messages: history.slice(-8) };

      if (imageFile) {
        body.image = {
          mimeType: imageFile.type,
          data: await fileToBase64(imageFile)
        };
      }

      const response = await fetch("/api/chat", {
        method: "POST",
        headers: {
          "Content-Type": "application/json; charset=utf-8",
          "Accept": "text/plain; charset=utf-8"
        },
        body: JSON.stringify(body)
      });

      if (!response.ok) {
        let message = `Request failed (HTTP ${response.status}).`;
        try {
          const result = await response.json();
          message = result.error || message;
        } catch (_) {}
        throw new Error(message);
      }

      if (!response.body) {
        throw new Error("The response stream is not available.");
      }

      const reader = response.body.getReader();
      const decoder = new TextDecoder("utf-8");

      while (true) {
        const { value, done } = await reader.read();
        if (done) break;

        answer += decoder.decode(value, { stream: true });

        const marker = "[TENX_ERROR]";
        if (answer.includes(marker)) {
          const detail = answer.substring(answer.indexOf(marker) + marker.length);
          let errorMessage = "The AI service returned an error.";
          try {
            errorMessage = JSON.parse(detail).error || errorMessage;
          } catch (_) {}
          throw new Error(errorMessage);
        }

        answerMessage.bubble.innerHTML = renderMessage(answer);
        answerMessage.bubble.appendChild(cursor);
        answerMessage.row.scrollIntoView({ behavior: "auto", block: "end" });
      }

      answer += decoder.decode();

      if (!answer.trim()) {
        throw new Error("The AI returned an empty response. Please try again.");
      }

      answerMessage.bubble.innerHTML = renderMessage(answer);
      history.push({ role: "assistant", content: answer });
      answerMessage.row.scrollIntoView({ behavior: "smooth", block: "end" });

    } catch (error) {
      answerMessage.row.remove();
      history.pop();
      showError(error.message || "Something went wrong. Please try again.");
    } finally {
      sending = false;
      sendBtn.disabled = false;
      imageBtn.disabled = false;
      promptEl.focus();
    }
  }
</script>
</body>
</html>
